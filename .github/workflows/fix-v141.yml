name: Apply v1.4.1 fixes

on:
  push:
    branches:
      - feature/smart-auto-quality-background-v1.4.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-auto-quality-background-v1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          trade_path = Path('src/screens/TradeScreen.tsx')
          text = trade_path.read_text()

          marker = "const TRAIL_DROP_PCT = 0.07;\n"
          assert marker in text
          if 'SMART_MIN_TRADE_USDT' not in text:
              text = text.replace(marker, marker + "const SMART_MIN_TRADE_USDT = 10;\n")

          marker = "  const cycleCountRef = useRef(0);\n"
          assert marker in text
          if 'sellBusyRef' not in text:
              text = text.replace(marker, marker + "  const sellBusyRef = useRef(false);\n")

          start = text.index("  const confirmAssistSell = (position: TrackedPosition) => {")
          end = text.index("  const startSmart = () => {", start)
          replacement = '''  const executeAssistSell = async (position: TrackedPosition) => {
    if (sellBusyRef.current || busy) return;
    if (!position.sellReady || position.currentPnlUsdt <= 0) {
      setError('SMART AUTO nie wystawia SELL na stracie. Pozycja pozostaje w monitoringu.');
      return;
    }

    sellBusyRef.current = true;
    setBusy(true);
    setError('');
    try {
      const ack = await placeSpotMarketSellBase(credentials, position.symbol, position.qty);
      const fill = await waitForSpotFill(credentials, ack.orderId);
      const pnl = fill.quoteValue - position.costUsdt;
      livePositionsRef.current = livePositionsRef.current.filter((item) => item.id !== position.id);
      setLivePositions([...livePositionsRef.current]);
      cycleCountRef.current += 1;
      sessionProfitRef.current += pnl;
      setCycleCount(cycleCountRef.current);
      setSessionProfit(sessionProfitRef.current);
      if (position.fromPortfolio) onHoldingConsumed?.();
      setSmartStatus(`SELL ${position.symbol} • wynik ${pnl >= 0 ? '+' : ''}${pnl.toFixed(4)} USDT. Skaner działa dalej.`);
      await refreshAvailableUsdt();
    } catch (e: unknown) {
      const message = e instanceof Error ? e.message : 'Błąd SELL.';
      const lowerLimit = /lower limit|minimum|min order|minimal/i.test(message);
      const shown = lowerLimit
        ? 'Pozycja jest za mała dla minimalnej wartości zlecenia Bybit. Nie została sprzedana.'
        : message;
      setError(shown);
      setSmartStatus(`SELL nieudany: ${shown} Skaner nadal monitoruje pozycję.`);
    } finally {
      sellBusyRef.current = false;
      setBusy(false);
    }
  };

'''
          text = text[:start] + replacement + text[end:]

          old = "    if (!Number.isFinite(trade) || trade <= 0 || trade > maxOrderUsdt) return setError(`Kwota musi być > 0 i <= ${maxOrderUsdt} USDT.`);\n"
          assert old in text
          text = text.replace(old, old + "    if (trade < SMART_MIN_TRADE_USDT) return setError(`SMART AUTO i DEMO wymagają minimum ${SMART_MIN_TRADE_USDT} USDT na jedną pozycję.`);\n", 1)

          replacements = {
              'SHADOW wykonuje tę samą strategię symulacyjnie. Realny BUY/SELL nadal wymaga potwierdzenia.': 'DEMO wykonuje tę samą strategię symulacyjnie i nie wysyła zleceń do Bybit. Realny BUY wymaga potwierdzenia, a SELL READY wykonujesz jednym kliknięciem.',
              '<Text style={styles.modeText}>SHADOW</Text>': '<Text style={styles.modeText}>DEMO</Text>',
              'Kapitał SHADOW (min. 10 USDT)': 'Kapitał DEMO (min. 10 USDT)',
              "return setError('Kapitał SHADOW: minimum 10 USDT i co najmniej wartość jednej transakcji.');": "return setError('Kapitał DEMO: minimum 10 USDT i co najmniej wartość jednej transakcji.');",
              'SHADOW SELL': 'DEMO SELL',
              'SHADOW BUY': 'DEMO BUY',
              'SHADOW: monitoruję': 'DEMO: monitoruję',
              "'START SHADOW'": "'START DEMO'",
              'onPress={() => confirmAssistSell(position)}': 'onPress={() => void executeAssistSell(position)}',
          }
          for a, b in replacements.items():
              assert a in text, a
              text = text.replace(a, b)

          trade_path.write_text(text)

          api_path = Path('src/api/bybit.ts')
          api = api_path.read_text()
          old = '''    basePrecision?: string;
    minOrderQty?: string;
    maxOrderQty?: string;
'''
          new = '''    basePrecision?: string;
    qtyStep?: string;
    minOrderQty?: string;
    minOrderAmt?: string;
    maxOrderQty?: string;
'''
          assert old in api
          api = api.replace(old, new, 1)

          old = '''  const instrument = await fetchSpotInstrument(symbol);
  const precision = Math.min(12, decimalPlaces(instrument.lotSizeFilter?.basePrecision));
  const factor = 10 ** precision;
  const baseQty = Math.floor(baseQtyInput * factor) / factor;
  const minQty = Number(instrument.lotSizeFilter?.minOrderQty || '0');
  if (baseQty <= 0 || (minQty > 0 && baseQty < minQty)) {
    throw new BybitError('Ilość po zaokrągleniu jest mniejsza niż minimum Bybit.', 'MIN_QTY');
  }

'''
          new = '''  const instrument = await fetchSpotInstrument(symbol);
  const stepText = instrument.lotSizeFilter?.qtyStep || instrument.lotSizeFilter?.basePrecision || '0.00000001';
  const step = Number(stepText);
  const precision = Math.min(12, decimalPlaces(stepText));
  const factor = 10 ** precision;
  const steppedQty = step > 0 ? Math.floor((baseQtyInput + Number.EPSILON) / step) * step : baseQtyInput;
  const baseQty = Math.floor((steppedQty + Number.EPSILON) * factor) / factor;
  const minQty = Number(instrument.lotSizeFilter?.minOrderQty || '0');
  if (baseQty <= 0 || (minQty > 0 && baseQty < minQty)) {
    throw new BybitError('Ilość po zaokrągleniu jest mniejsza niż minimum Bybit.', 'MIN_QTY');
  }

  const minOrderAmt = Number(instrument.lotSizeFilter?.minOrderAmt || '0');
  if (minOrderAmt > 0) {
    const snapshot = await fetchSpotMarketSnapshot(symbol);
    const executablePrice = snapshot.bid > 0 ? snapshot.bid : snapshot.lastPrice;
    const estimatedValue = baseQty * executablePrice;
    if (estimatedValue + 1e-8 < minOrderAmt) {
      throw new BybitError(`Wartość pozycji ${estimatedValue.toFixed(2)} USDT jest poniżej minimum Bybit ${minOrderAmt.toFixed(2)} USDT.`, 'MIN_ORDER_AMT');
    }
  }

'''
          assert old in api
          api = api.replace(old, new, 1)
          api_path.write_text(api)

          version_path = Path('src/version.ts')
          version = version_path.read_text()
          version = version.replace("export const APP_VERSION = '1.4.0';", "export const APP_VERSION = '1.4.1';")
          version = version.replace('export const APP_BUILD = 140;', 'export const APP_BUILD = 141;')
          version_path.write_text(version)

          app_path = Path('app.json')
          app = json.loads(app_path.read_text())
          app['expo']['version'] = '1.4.1'
          app['expo']['ios']['buildNumber'] = '141'
          app['expo']['android']['versionCode'] = 141
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n')

          wf = Path('.github/workflows/fix-v141.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v1.4.1: one-tap SELL, DEMO labels and Bybit order guards"
          git push origin HEAD:feature/smart-auto-quality-background-v1.4.0
