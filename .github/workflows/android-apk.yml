name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install native runtime modules
        run: npx expo install expo-file-system expo-intent-launcher expo-background-fetch expo-task-manager expo-notifications

      - name: Lint check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Generate Android Native Project (Expo Prebuild)
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone Release APK with bundled JS
        timeout-minutes: 35
        env:
          NODE_ENV: production
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK exists
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK Artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk bybit-trading-app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bybit-trading-app-release-apk
          path: bybit-trading-app-release.apk
          retention-days: 30

      - name: Publish or update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bybit-trading-app-release.apk --clobber
          else
            gh release create "$TAG" bybit-trading-app-release.apk --title "Bybit Trading App $TAG" --notes "Automatyczny build Android."
          fi
